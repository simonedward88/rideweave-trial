  <script>/* RideWeave v0.2 — local-first evaluation application.
   No network requests, tracking, accounts, external AI, or third-party API integrations.
   Coaching logic is rule-based and for evaluation only, not a medical clearance system. */
'use strict';
const KEY='rideweave_trial_v1';
const LEGACY_KEY='pacestrata_trial_v1';
const DAY=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const NAV=[['dashboard','◈','Dashboard'],['season','⚑','Season planner'],['training','▦','Training plan'],['course','⌁','Course intelligence'],['strategy','◉','Event strategy'],['recovery','♡','Recovery & health'],['activities','↗','Activity history'],['athlete','⚙','Athlete & data']];
const NOW=()=>new Date();
const iso=d=>{let x=new Date(d); return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')};
const fromISO=s=>new Date(String(s)+'T12:00:00');
const daysBetween=(a,b)=>Math.round((fromISO(b)-fromISO(a))/864e5);
const weekStart=d=>{let x=fromISO(iso(d));x.setDate(x.getDate()-(x.getDay()+6)%7);return iso(x)};
const addDays=(s,n)=>{let d=fromISO(s);d.setDate(d.getDate()+n);return iso(d)};
const fmtDate=s=>fromISO(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const month=s=>fromISO(s).toLocaleDateString('en-GB',{month:'short'}).toUpperCase();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const n=(v,d=0)=>Number.isFinite(+v)?+v:d;
const round=(v,d=0)=>Number(n(v).toFixed(d));

document.getElementById('gpxFile').addEventListener('change',async ev=>{let file=ev.target.files?.[0];if(!file)return;let id=ev.target.dataset.event,old=state.events.find(x=>x.id===id);try{let r=parseGPX(await file.text());if(!old)throw Error('Selected event was not found.');old.route=r;old.source=`Imported GPX: ${file.name}; local estimates, not verified terrain.`;state.selectedEvent=id;save();view='course';location.hash='course';render();toast(`GPX analysed: ${r.distance} km, ${r.ascent??'unknown'} m climbing.`)}catch(err){toast('GPX import failed: '+err.message)}ev.target.value=''});
document.getElementById('activityCsvFile').addEventListener('change',async ev=>{let file=ev.target.files?.[0];if(!file)return;try{let count=await importActivityCsv(file);render();toast(`${count} ride(s) imported.`)}catch(err){toast('CSV import failed: '+err.message)}ev.target.value=''});
document.getElementById('backupFile').addEventListener('change',async ev=>{let file=ev.target.files?.[0];if(!file)return;try{if(file.size>8*1024*1024)throw Error('Backup exceeds 8 MB.');let obj=JSON.parse(await file.text());if(obj.version!==1||!Array.isArray(obj.events)||!Array.isArray(obj.activities)||!obj.athlete||!Array.isArray(obj.checkins))throw Error('Not a compatible RideWeave backup.');if(!confirm('Restore this backup and replace the current local data?'))return;state=obj;save();render();toast('Backup restored.')}catch(err){toast('Restore failed: '+err.message)}ev.target.value=''});
window.addEventListener('resize',()=>{if(view==='course'&&getCourse(currentEvent()))drawCourse()});
render();
</script>
</body>
</html>

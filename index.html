  /* v0.5 — workout zones and coach-led event preparation */
  .power-profile{display:block;width:100%;height:auto;min-height:140px;max-height:260px;border-radius:8px;margin:10px auto}

function drawCourse(){let r=getCourse(currentEvent());if(!r)return;drawMap(document.getElementById('routeMap'),r);drawElevation(document.getElementById('elevCanvas'),r)}
function setupCanvas(canvas){if(!canvas)return null;let w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.floor(w*dpr);canvas.height=Math.floor(h*dpr);let ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);return {ctx,w,h}}
function drawMap(canvas,r){let data=setupCanvas(canvas);if(!data)return;let {ctx,w,h}=data,points=r.points;if(!points?.length)return;let lngs=points.map(x=>x[0]),lats=points.map(x=>x[1]),minx=Math.min(...lngs),maxx=Math.max(...lngs),miny=Math.min(...lats),maxy=Math.max(...lats);let latitude=Math.cos(((miny+maxy)/2)*Math.PI/180),dx=(maxx-minx)*latitude,dy=maxy-miny,pad=26,scale=Math.min((w-2*pad)/Math.max(.000001,dx),(h-2*pad)/Math.max(.000001,dy));const xy=p=>[(w-dx*scale)/2+(p[0]-minx)*latitude*scale,h-(h-dy*scale)/2-(p[1]-miny)*scale];
 ctx.clearRect(0,0,w,h);ctx.strokeStyle='#1a3041';ctx.lineWidth=1;for(let i=0;i<w;i+=38){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,h);ctx.stroke()}for(let i=0;i<h;i+=38){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(w,i);ctx.stroke()}
 ctx.beginPath();points.forEach((p,i)=>{let [x,y]=xy(p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.lineWidth=3;ctx.strokeStyle='#90d2ed';ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();
 if(activeSector!=null&&r.climbs[activeSector]){let c=r.climbs[activeSector];let relevant=points.filter(p=>p[2]>=c.start&&p[2]<=c.end);ctx.beginPath();relevant.forEach((p,i)=>{let [x,y]=xy(p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.lineWidth=5;ctx.strokeStyle='#c2f477';ctx.stroke()}
 let [sx,sy]=xy(points[0]);ctx.fillStyle='#c2f477';ctx.beginPath();ctx.arc(sx,sy,6,0,2*Math.PI);ctx.fill();ctx.font='11px sans-serif';ctx.fillStyle='#a8c9cb';ctx.fillText('START',sx+9,sy-8);ctx.fillText('Track footprint · not a street map',14,h-10);
}
function drawElevation(canvas,r){let data=setupCanvas(canvas);if(!data)return;let {ctx,w,h}=data,pts=r.profile;if(!pts?.length||!r.hasElevation){ctx.fillStyle='#8ba2b1';ctx.fillText('No reliable elevation in this GPX.',20,h/2);return}let pad={l:44,r:12,t:15,b:28},min=Math.min(...pts.map(x=>x[1])),max=Math.max(...pts.map(x=>x[1])),span=Math.max(1,max-min);let X=d=>pad.l+(d/r.distance)*(w-pad.l-pad.r),Y=v=>h-pad.b-((v-min)/span)*(h-pad.t-pad.b);ctx.strokeStyle='#304653';ctx.fillStyle='#91abb7';ctx.font='10px sans-serif';for(let i=0;i<5;i++){let v=min+span*i/4,y=Y(v);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(Math.round(v)+'m',3,y+4)}let grd=ctx.createLinearGradient(0,pad.t,0,h-pad.b);grd.addColorStop(0,'rgba(194,244,119,.35)');grd.addColorStop(1,'rgba(194,244,119,.02)');ctx.beginPath();ctx.moveTo(X(pts[0][0]),h-pad.b);pts.forEach(p=>ctx.lineTo(X(p[0]),Y(p[1])));ctx.lineTo(X(pts.at(-1)[0]),h-pad.b);ctx.fillStyle=grd;ctx.fill();ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));ctx.strokeStyle='#c2f477';ctx.lineWidth=2;ctx.stroke();
 for(let i=0;i<=4;i++){let d=r.distance*i/4;ctx.fillStyle='#8ba2b1';ctx.fillText(round(d)+' km',X(d)-12,h-8)}
 if(activeSector!=null&&r.climbs[activeSector]){let c=r.climbs[activeSector];ctx.fillStyle='#b5ef8050';ctx.fillRect(X(c.start),pad.t,X(c.end)-X(c.start),h-pad.b-pad.t)}
 canvas.onmousemove=ev=>{let box=canvas.getBoundingClientRect(),x=ev.clientX-box.left,d=clamp((x-pad.l)/(w-pad.l-pad.r),0,1)*r.distance,closest=pts.reduce((a,b)=>Math.abs(b[0]-d)<Math.abs(a[0]-d)?b:a,pts[0]);let tip=document.getElementById('elevTip');if(tip){tip.textContent=`${round(closest[0],1)} km · ${Math.round(closest[1])} m`;tip.style.display='block';tip.style.left=Math.min(w-135,Math.max(8,x+8))+'px';tip.style.top='6px'}};canvas.onmouseleave=()=>{let tip=document.getElementById('elevTip');if(tip)tip.style.display='none'};
}
const newId=()=>('id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
// Delegated interaction handler: each user-visible action has a real implementation.
document.addEventListener('click',async ev=>{
 let nav=ev.target.closest('[data-view]');if(nav){view=nav.dataset.view;return}
 let btn=ev.target.closest('[data-act]');if(!btn)return;let act=btn.dataset.act,date=btn.dataset.date,id=btn.dataset.id;
 switch(act){
 case 'closemodal':closeModal();break;
 case 'season':case 'training':case 'course':case 'strategy':case 'recovery':case 'athlete':case 'activities':view=act;window.location.hash=act;render();break;
 case 'addevent':eventModal();break;
 case 'editevent':eventModal(id);break;
 case 'setprimary':state.events.forEach(x=>{if(x.priority==='A')x.priority='B'});state.events.find(x=>x.id===id).priority='A';save();toast('Main event target updated.');render();break;
 case 'selectevent':setEvent(id);view='course';window.location.hash='course';render();break;
 case 'deleteevent':if(state.events.length<2){toast('Keep at least one event in the calendar.');break}if(confirm('Delete this event and its attached route?')){state.events=state.events.filter(x=>x.id!==id);if(state.selectedEvent===id)state.selectedEvent=state.events[0].id;save();closeModal();render();toast('Event deleted.')}break;
 case 'choosegpx':document.getElementById('gpxFile').dataset.event=id||state.selectedEvent;document.getElementById('gpxFile').click();break;
 case 'sector':activeSector=Number(btn.dataset.idx);render();break;
 case 'prevweek':state.settings.weekOffset=clamp(n(state.settings.weekOffset)-1,-1,24);save();render();break;
 case 'nextweek':state.settings.weekOffset=clamp(n(state.settings.weekOffset)+1,-1,24);save();render();break;
 case 'thisweek':state.settings.weekOffset=0;save();render();break;
  case 'jumpweek':state.settings.weekOffset=clamp(n(btn.dataset.week),0,23);save();render();break;
 case 'workout':workoutModal(date);break;
 case 'fuelride':fuelFeedbackModal(id);break;
 case 'refreshweather':weatherFailures.delete(currentEvent().id);render();break;
 case 'markdone':case 'markmissed':state.logs[date]=act==='markdone'?'done':'missed';save();closeModal();render();toast('Session status saved.');break;
 case 'rebalance':replanWeek();break;
 case 'exportzwo':exportZWO(date);break;
 case 'exportplan':exportPlan();break;
 case 'exportstrategy':exportStrategy();break;
 case 'printstrategy':window.print();break;
 case 'horizon':showModal('Rolling plan length',`<p class="help-copy">Choose how much of the season is visible in the detailed training block. Longer-range training remains provisional and will need reassessment.</p><div class="btnrow">${action('12 weeks','changehorizon','secondary',`data-weeks="12"`)}${action('16 weeks','changehorizon','',`data-weeks="16"`)}</div>`);break;
 case 'changehorizon':state.settings.trainingHorizon=n(btn.dataset.weeks,16);save();closeModal();render();toast('Training horizon updated.');break;
 case 'savehealth':document.getElementById('healthForm')?.requestSubmit();break;
 case 'importactivities':document.getElementById('activityCsvFile').click();break;
 case 'importridefiles':document.getElementById('activityRideFiles').click();break;
 case 'addactivity':addActivityModal();break;
  case 'historycoverage':state.settings.historyCoverage=btn.dataset.coverage==='complete'?'complete':'partial';save();render();toast('Training evidence setting updated; plan recalculated.');break;
  case 'editrpe':{const a=state.activities.find(x=>x.id===id);if(!a)break;const raw=prompt('How hard was this ride overall? RPE 1 (very easy) to 10 (maximal), or blank to clear.',a.rpe||'');if(raw===null)break;if(raw.trim()==='')a.rpe=0;else if(Number.isInteger(+raw)&&+raw>=1&&+raw<=10)a.rpe=+raw;else {toast('Enter a whole number from 1 to 10.');break;}save();render();toast('Ride feedback updated.');break;}
 case 'removeactivity':if(confirm('Remove this activity?')){state.activities=state.activities.filter(x=>x.id!==id);save();render()}break;
 case 'csvtemplate':download('RideWeave_activity_template.csv','date,title,duration_min,distance_km,ascent_m,avg_power,rpe\r\n2026-10-24,Gravel endurance,210,78,1100,155,6\r\n','text/csv');break;
 case 'exportbackup':case 'backupQuick':download('RideWeave_backup_'+iso(NOW())+'.json',JSON.stringify(state,null,2),'application/json');toast('Backup downloaded.');break;
 case 'importbackup':document.getElementById('backupFile').click();break;
 case 'resettrial':if(confirm('Reset the app to demonstration data? This removes local entries and attached GPX routes. Export a backup first.')){state=initState();save();view='dashboard';location.hash='dashboard';render();toast('Trial reset.')}break;
 default:break;
 }
});
window.addEventListener('hashchange',()=>{let hash=location.hash.slice(1);if(NAV.some(x=>x[0]===hash)){view=hash;render()}});
document.getElementById('menuToggle').addEventListener('click',()=>document.querySelector('.sidebar').classList.toggle('open'));
document.getElementById('backupQuick').addEventListener('click',()=>{download('RideWeave_backup_'+iso(NOW())+'.json',JSON.stringify(state,null,2),'application/json');toast('Backup downloaded.')});
document.addEventListener('change',ev=>{if(ev.target.id==='courseEvent'||ev.target.id==='strategyEvent')setEvent(ev.target.value)});
document.addEventListener('submit',ev=>{
 let form=ev.target;ev.preventDefault();let fd=new FormData(form),val=k=>fd.get(k);
 if(form.getAttribute('id')==='athleteForm'){let a=state.athlete;for(let k of ['name','discipline','notes'])a[k]=String(val(k)||'').slice(0,1000);for(let k of ['weight','ftp','baseHours','targetHours'])a[k]=n(val(k));a.ftpVerified=fd.has('ftpVerified');save();render();toast('Athlete profile saved.');}
 if(form.getAttribute('id')==='availabilityForm'){state.athlete.trainingDays=DAY.map((_,i)=>clamp(round(val('day'+i)),0,480));save();render();toast('Your availability is now used in the plan.');}
 if(form.getAttribute('id')==='strategyForm'){currentEvent().feedPoints=String(val('feeds')||'').replace(/[^0-9., ]/g,'').slice(0,100);save();render();toast('Checkpoint plan updated. Coach targets recalculated.');}
 if(form.getAttribute('id')==='eventForm'){let id=String(val('id')||''),old=state.events.find(x=>x.id===id);let x={id:old?.id||newId(),name:String(val('name')||'Event').slice(0,100),date:String(val('date')),discipline:String(val('discipline')),distance:clamp(n(val('distance')),0,1000),ascent:val('ascent')===''?null:clamp(n(val('ascent')),0,20000),priority:String(val('priority')||'C'),goal:String(val('goal')||'').slice(0,1000),source:String(val('source')||'User-entered').slice(0,250),feedPoints:old?.feedPoints||'',startTime:String(val('startTime')||'').slice(0,5),route:old?.route||null};if(x.priority==='A')state.events.forEach(z=>{if(z.id!==x.id&&z.priority==='A')z.priority='B'});if(old)Object.assign(old,x);else state.events.push(x);save();closeModal();render();toast('Season calendar updated.');}
 if(form.getAttribute('id')==='fuelFeedbackForm'){const a=state.activities.find(x=>x.id===val('id'));if(a){a.carbsConsumed=val('carbsConsumed')===''?null:clamp(n(val('carbsConsumed')),0,1000);a.fluidConsumed=val('fluidConsumed')===''?null:clamp(n(val('fluidConsumed')),0,12000);a.gutComfort=String(val('gutComfort')||'');save();closeModal();render();toast('Fuelling practice saved. Coach recommendations updated.');}}
 if(form.getAttribute('id')==='activityForm'){state.activities.push({id:newId(),date:String(val('date')),title:String(val('title')||'Ride').slice(0,160),duration:clamp(round(val('duration')),1,3000),distance:clamp(n(val('distance')),0,1000),ascent:clamp(n(val('ascent')),0,15000),power:clamp(n(val('power')),0,1200),rpe:clamp(n(val('rpe')),1,10)});save();closeModal();render();toast('Ride added to history.');}
 if(form.getAttribute('id')==='healthForm'){let c={date:iso(NOW()),fatigue:clamp(n(val('fatigue')),1,5),sleep:clamp(n(val('sleep')),0,15),pain:clamp(n(val('pain')),0,10),painArea:String(val('painArea')||'').slice(0,130),illness:String(val('illness')||'none'),mood:String(val('mood')||'normal'),painWorse:fd.has('painWorse'),redJoint:fd.has('redJoint'),redChest:fd.has('redChest')};state.checkins=state.checkins.filter(x=>x.date!==c.date);state.checkins.push(c);save();render();toast('Recovery check-in saved and training advice recalculated.');}
});
document.getElementById('gpxFile').addEventListener('change',async ev=>{let file=ev.target.files?.[0];if(!file)return;let id=ev.target.dataset.event,old=state.events.find(x=>x.id===id);try{let r=parseGPX(await file.text());if(!old)throw Error('Selected event was not found.');old.route=r;old.source=`Imported GPX: ${file.name}; local estimates, not verified terrain.`;state.selectedEvent=id;save();view='course';location.hash='course';render();toast(`GPX analysed: ${r.distance} km, ${r.ascent??'unknown'} m climbing.`)}catch(err){toast('GPX import failed: '+err.message)}ev.target.value=''});
document.getElementById('activityCsvFile').addEventListener('change',async ev=>{let file=ev.target.files?.[0];if(!file)return;try{let count=await importActivityCsv(file);render();toast(`${count} ride(s) imported.`)}catch(err){toast('CSV import failed: '+err.message)}ev.target.value=''});
document.getElementById('activityRideFiles').addEventListener('change',async ev=>{
 const files=Array.from(ev.target.files||[]).slice(0,150);ev.target.value='';if(!files.length)return;
 if(!window.RideWeaveImport){toast('Ride importer did not load. Refresh the app.');return;}
 const before=state.activities.length;let added=0,duplicates=0,issues=[];
 const key=a=>a.startTime?'t:'+a.startTime+':'+a.duration:'d:'+a.date+':'+a.duration+':'+a.distance;
 const seen=new Set(state.activities.map(key));
 for(const file of files){try{const a=await window.RideWeaveImport.parse(file);const k=key(a);if(seen.has(k)){duplicates++;continue;}seen.add(k);state.activities.push({...a,id:newId()});added++;}catch(err){issues.push(file.name+': '+err.message);}}
 if(added&&!save()){state.activities.length=before;issues.push('Browser storage full: existing data unchanged.');added=0;}
 render();
 const message=added+' ride(s) imported'+(duplicates?', '+duplicates+' duplicate(s) skipped':'')+(issues.length?', '+issues.length+' failed':'')+'.';toast(message);
 if(issues.length){const list=issues.slice(0,10).join('\n');alert(message+'\n\n'+list+(issues.length>10?'\n...':'')+'\n\nCheck formats and try again.');}
});
document.getElementById('backupFile').addEventListener('change',async ev=>{let file=ev.target.files?.[0];if(!file)return;try{if(file.size>8*1024*1024)throw Error('Backup exceeds 8 MB.');let obj=JSON.parse(await file.text());if(obj.version!==1||!Array.isArray(obj.events)||!Array.isArray(obj.activities)||!obj.athlete||!Array.isArray(obj.checkins))throw Error('Not a compatible RideWeave backup.');if(!confirm('Restore this backup and replace the current local data?'))return;state=obj;save();render();toast('Backup restored.')}catch(err){toast('Restore failed: '+err.message)}ev.target.value=''});

render();
